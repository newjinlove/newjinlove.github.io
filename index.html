<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신진</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* 전체 페이지 배경 이미지 설정 (선택사항) */
        /* body {
            background-image: url('images/page-background.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        } */

        /* 슬라이드 섹션 */
        .slide-section {
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .slides-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .slide.active {
            opacity: 1;
            z-index: 1;
        }

        .slide:nth-child(1) {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            /* 배경 이미지를 사용하려면 아래 주석을 해제하고 이미지 경로를 입력하세요 */
            /* background-image: url('images/background1.jpg'); */
            /* background: linear-gradient(135deg, rgba(102, 126, 234, 0.8) 0%, rgba(118, 75, 162, 0.8) 100%), url('images/background1.jpg'); */
        }

        .slide:nth-child(2) {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            /* 배경 이미지를 사용하려면 아래 주석을 해제하고 이미지 경로를 입력하세요 */
            /* background-image: url('images/background2.jpg'); */
            /* background: linear-gradient(135deg, rgba(240, 147, 251, 0.8) 0%, rgba(245, 87, 108, 0.8) 100%), url('images/background2.jpg'); */
        }

        .slide:nth-child(3) {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            /* 배경 이미지를 사용하려면 아래 주석을 해제하고 이미지 경로를 입력하세요 */
            /* background-image: url('images/background3.jpg'); */
            /* background: linear-gradient(135deg, rgba(79, 172, 254, 0.8) 0%, rgba(0, 242, 254, 0.8) 100%), url('images/background3.jpg'); */
        }

        .slide-content {
            text-align: center;
            color: white;
            padding: 2rem;
        }

        .slide-content h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .slide-button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: white;
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .slide-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            background: #f0f0f0;
        }

        /* 슬라이드 네비게이션 점 */
        .slide-dots {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: white;
            transform: scale(1.3);
        }

        /* 일반 섹션 */
        .content-section {
            min-height: 100vh;
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-section h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #333;
        }

        #truth-section {
            background: #f8f9fa;
        }

        #nation-section {
            background: #ffffff;
        }

        #project-section {
            background: #f8f9fa;
        }

        /* 부드러운 스크롤 */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <!-- 첫 번째 섹션: 슬라이드 -->
    <section class="slide-section" id="home">
        <div class="slides-container">
            <!-- 슬라이드 1: 진리관 -->
            <div class="slide active">
                <div class="slide-content">
                    <h1>진리관</h1>
                    <button class="slide-button" onclick="scrollToSection('truth-section')">
                        진리관으로 이동
                    </button>
                </div>
            </div>

            <!-- 슬라이드 2: 국가관 -->
            <div class="slide">
                <div class="slide-content">
                    <h1>국가관</h1>
                    <button class="slide-button" onclick="scrollToSection('nation-section')">
                        국가관으로 이동
                    </button>
                </div>
            </div>

            <!-- 슬라이드 3: 프로젝트 -->
            <div class="slide">
                <div class="slide-content">
                    <h1>프로젝트</h1>
                    <button class="slide-button" onclick="scrollToSection('project-section')">
                        프로젝트로 이동
                    </button>
                </div>
            </div>
        </div>

        <!-- 슬라이드 네비게이션 점 -->
        <div class="slide-dots">
            <span class="dot active" onclick="goToSlide(0)"></span>
            <span class="dot" onclick="goToSlide(1)"></span>
            <span class="dot" onclick="goToSlide(2)"></span>
        </div>
    </section>

    <!-- 두 번째 섹션: 진리관 -->
    <section class="content-section" id="truth-section">
        <h2>진리관</h2>
        <!-- 내용을 여기에 추가하세요 -->
    </section>

    <!-- 세 번째 섹션: 국가관 -->
    <section class="content-section" id="nation-section">
        <h2>국가관</h2>
        <!-- 내용을 여기에 추가하세요 -->
    </section>

    <!-- 네 번째 섹션: 프로젝트 소개 -->
    <section class="content-section" id="project-section">
        <h2>프로젝트 소개</h2>
        <!-- 내용을 여기에 추가하세요 -->
    </section>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const totalSlides = slides.length;

        // 슬라이드 이동 함수
        function goToSlide(index) {
            slides[currentSlide].classList.remove('active');
            dots[currentSlide].classList.remove('active');
            
            currentSlide = index;
            
            slides[currentSlide].classList.add('active');
            dots[currentSlide].classList.add('active');
        }

        // 자동 슬라이드 (5초마다)
        setInterval(() => {
            const nextSlide = (currentSlide + 1) % totalSlides;
            goToSlide(nextSlide);
        }, 5000);

        // 섹션으로 부드럽게 스크롤
        function scrollToSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section) {
                section.scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
